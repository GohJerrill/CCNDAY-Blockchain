<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CareLink icon</title>
  <desc id="desc">A neon gradient logo icon combining a heart, chain link, and QR scan corner marks.</desc>

  <defs>
    <linearGradient id="carelinkGradient" x1="72" y1="438" x2="438" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.34" stop-color="#7A5CFF"/>
      <stop offset="0.62" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#69F2D0"/>
    </linearGradient>

    <linearGradient id="heartGradient" x1="128" y1="348" x2="390" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.43" stop-color="#A85CFF"/>
      <stop offset="0.76" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#FF6AAE"/>
    </linearGradient>

    <linearGradient id="linkGradient" x1="156" y1="354" x2="336" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.47" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#E85BDB"/>
    </linearGradient>

    <linearGradient id="tlGradient" x1="54" y1="58" x2="150" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#B85CFF"/>
    </linearGradient>

    <linearGradient id="trGradient" x1="356" y1="58" x2="458" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4FA3"/>
      <stop offset="1" stop-color="#FF69B4"/>
    </linearGradient>

    <linearGradient id="blGradient" x1="56" y1="356" x2="154" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82FF"/>
      <stop offset="1" stop-color="#3478FF"/>
    </linearGradient>

    <linearGradient id="brGradient" x1="358" y1="356" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67F0D0"/>
      <stop offset="1" stop-color="#5BE7C8"/>
    </linearGradient>

    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.35  0 1 0 0 0.2  0 0 1 0 0.9  0 0 0 0.45 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- QR scan corners -->
    <path d="M72 142V92C72 80.954 80.954 72 92 72H142" stroke="url(#tlGradient)" stroke-width="18"/>
    <path d="M370 72H420C431.046 72 440 80.954 440 92V142" stroke="url(#trGradient)" stroke-width="18"/>
    <path d="M72 370V420C72 431.046 80.954 440 92 440H142" stroke="url(#blGradient)" stroke-width="18"/>
    <path d="M370 440H420C431.046 440 440 431.046 440 420V370" stroke="url(#brGradient)" stroke-width="18"/>

    <!-- QR dots -->
    <rect x="120" y="120" width="30" height="30" rx="7" fill="url(#tlGradient)"/>
    <rect x="362" y="120" width="30" height="30" rx="7" fill="url(#trGradient)"/>
    <rect x="120" y="362" width="30" height="30" rx="7" fill="url(#blGradient)"/>
    <rect x="362" y="362" width="30" height="30" rx="7" fill="url(#brGradient)"/>

    <!-- Heart outline -->
    <path
      d="M256 392C248 384 178 320 148 286C112 245 107 185 145 151C177 122 226 128 256 166C286 128 335 122 367 151C405 185 400 245 364 286C334 320 264 384 256 392Z"
      stroke="url(#heartGradient)"
      stroke-width="28"
      fill="none"
    />

    <!-- Chain/link motif -->
    <g stroke="url(#linkGradient)" stroke-width="28" fill="none">
      <rect x="166" y="268" width="126" height="62" rx="31" transform="rotate(-45 166 268)"/>
      <rect x="226" y="208" width="126" height="62" rx="31" transform="rotate(-45 226 208)"/>
    </g>
  </g>
</svg>
